name = "mdxdoc-api"
account_id = "b8afc92c7a87f699592038b756153d22"
main = "src/worker/index.ts"
compatibility_date = "2026-06-01"

[[durable_objects.bindings]]
name = "DOCUMENT_ROOM"
class_name = "DocumentRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DocumentRoom"]

[[d1_databases]]
binding = "DB"
database_name = "mdxdoc-metadata"
database_id = "e425710d-3392-4b78-ad3b-740595fbe740"

[[artifacts]]
binding = "ARTIFACTS"
namespace = "default"

[[queues.producers]]
binding = "SNAPSHOT_QUEUE"
queue = "mdxdoc-snapshot"

[[queues.producers]]
binding = "EXPORT_QUEUE"
queue = "mdxdoc-export"

[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "mdxdoc-notification"

[[queues.consumers]]
queue = "mdxdoc-snapshot"
max_batch_size = 10
max_retries = 3
dead_letter_queue = "mdxdoc-dlq"

[[workflows]]
binding = "WORKFLOWS"
name = "mdxdoc-workflows"
class_name = "MdxdocWorkflow"
